<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "en-us" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
  <script>
    // Sidebar toggle for narrow viewports.
    document.querySelector('.nav-toggle')?.addEventListener('click', function () {
      document.querySelector('.sidebar')?.classList.toggle('open');
    });
  </script>
</body>
</html>
